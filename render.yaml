# Render Blueprint. Optional - the same values can be set by hand in the
# Render dashboard. Secrets are marked sync:false so they are never committed.
services:
  - type: web
    name: conferencehub-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: conferencehub
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Signs the session cookie. Render can generate this one for you.
      - key: SESSION_SECRET
        generateValue: true
      # From the GitHub OAuth app. The callback must match the one registered
      # there exactly: https://<your-service>.onrender.com/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
